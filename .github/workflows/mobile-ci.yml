name: Flutter CI

# Gate BOTH Flutter apps and every shared Dart package on a green analyzer +
# passing tests.
#
# Coverage history: this workflow once matched only `mobile/**`, so a change to
# migrations/ or packages/ ran zero CI. That was fixed; what stayed uncovered was
# `desktop/` — 84 test files and the larger of the two UI surfaces, guarded by
# nothing. The first time the desktop suite ran here it was already red (a
# date-dependent test that passed only on the day it was written, plus 7
# analyzer findings), which is precisely what "no CI" buys you.
on:
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - 'desktop/**'
      - 'packages/**'
      - 'migrations/**'
      - 'schema.sql'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'desktop/**'
      - 'packages/**'
      - 'migrations/**'
      - 'schema.sql'
      - '.github/workflows/mobile-ci.yml'

# Run every job in a zone that HAS daylight saving.
#
# GitHub runners default to UTC, which has no DST transition — so every
# DST-sensitive test in this repo is inert on CI. That is not hypothetical: five
# test-file headers across both apps already say so in prose, and the sleep-window
# group in mobile/test/method_channel_bridges_test.dart passes under UTC even if
# the window is rebuilt with `Duration(days:)`, which is exactly the construction
# the codebase forbids for calendar arithmetic (a Duration day is a fixed 24h and
# drifts off the intended wall-clock hour across a transition).
#
# Europe/Rome is the app's home zone and transitions on the EU dates the tests
# name. Set at workflow level so a new job cannot silently opt out.
env:
  TZ: Europe/Rome

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Provide config files (real configs are git-ignored)
        run: |
          for f in lib/core/*.dart.example; do
            cp -n "$f" "${f%.example}"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations (slang outputs are git-ignored)
        run: dart run slang

      - name: Analyze (fail on any issue, including info-level lints)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  # App Store metadata. This job exists because nothing caught the defect that
  # got iOS 1.1.2 rejected TWICE under Guideline 3.1.2(c): five localisations
  # were truncated at App Store Connect's 4000-character ceiling, and because
  # the legal block sits at the end of the description, the truncation removed
  # the mandatory Terms of Use (EULA) link. The live German and French listings
  # shipped with no Terms link and no privacy link at all.
  #
  # Cheap to run, and it fails on exactly the shape of that bug: over-length
  # descriptions, missing EULA/privacy URLs, and text ending in a truncation
  # ellipsis. Run it before `fastlane deliver`, never after.
  appstore-metadata:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Rebuilding first proves metadata/ is reproducible from the sources in
      # metadata_src/ rather than hand-edited. The diff check below is what
      # turns that into a gate.
      - name: Build metadata from sources
        run: python3 tool/appstore/build_metadata.py

      # --exit-code alone ignores UNTRACKED files, so a locale added to
      # locales.json and metadata_src/ but never `git add`ed would be created
      # here, pass the diff, pass validation, and still be missing from a fresh
      # checkout. Check both.
      - name: Fail if the committed metadata is not what the build produces
        run: |
          git diff --exit-code -- metadata/
          untracked="$(git status --porcelain --untracked-files=all -- metadata/)"
          if [ -n "$untracked" ]; then
            echo "::error::metadata/ has files the build produced but git does not track:"
            echo "$untracked"
            exit 1
          fi

      - name: Validate App Store metadata
        run: python3 tool/appstore/validate_metadata.py

  # macOS client. MUST run on a macOS runner, not ubuntu.
  #
  # This is not a preference. `settings_page.dart` gates the whole iCloud Sync
  # card on `Platform.isMacOS` (and the sync service returns a no-op off-macOS),
  # so on Linux the widget tree under test simply does not exist and
  # icloud_sync_card_test.dart fails 12/12 with "Found 0 widgets". The first CI
  # run proved it. Since iCloud sync is the subsystem with the most incident
  # history in this repo, skipping those tests on a cheap runner would gate the
  # least and cost the most trust.
  #
  # macOS runners bill at a higher rate than ubuntu ones. If that ever bites,
  # the honest fallback is `@TestOn('mac-os')` on the platform-gated files plus
  # ubuntu — but that buys cheapness by NOT running them, and the trade should
  # be made deliberately rather than discovered later.
  #
  # No codegen or config-copy step is needed: desktop COMMITS its slang output
  # (lib/i18n/*.g.dart) and has no git-ignored lib/core config files. SQLite
  # ships with macOS, so sqflite_common_ffi needs no install step either.
  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail on any issue, including info-level lints)
        run: flutter analyze --fatal-infos --fatal-warnings

      # desktop_supabase_config_security_test asserts the credentials arrive via
      # --dart-define rather than a committed fallback, so it fails a bare
      # `flutter test` BY DESIGN. Dummy values satisfy it without shipping a
      # secret; nothing in the suite makes a network call.
      - name: Test
        run: |
          flutter test \
            --dart-define=EVOLVE_SUPABASE_URL=https://dummy.supabase.co \
            --dart-define=EVOLVE_SUPABASE_PUBLISHABLE_KEY=dummy_key

  # Shared pure-Dart packages (schema, verification, targets, legal). Previously
  # ran ZERO CI, so a migration or reconcile bug could land unguarded. This
  # includes the evolve_sync schema-migration tests
  # (private_db_schema_v*_test.dart) and the evolve_targets reconcile/freeze
  # tests. evolve_legal guards the App Store compliance URLs (Guidelines 1.5 /
  # 3.1.2) and was the last package left out of the matrix.
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [evolve_verification, evolve_targets, evolve_sync, evolve_legal]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail on any issue, including info-level lints)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test
