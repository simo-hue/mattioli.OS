# Static analysis configuration. Run `flutter analyze` (also gated in CI:
# see .github/workflows/mobile-ci.yml at the repo root).
#
# Baseline: the recommended Flutter lint set, hardened with a focused overlay
# of correctness/async-safety rules. Generated code is excluded so codegen
# churn never breaks the gate.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/i18n/**          # generated by slang (`dart run slang`)
    - "**/*.g.dart"        # other generated sources
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  errors:
    # Context-across-async is a real crash/leak source — make it a hard error
    # so it can never merge. (Already clean today; this keeps it that way.)
    use_build_context_synchronously: error

linter:
  rules:
    # --- Correctness / async safety ---
    - unawaited_futures
    - avoid_print
    # --- Consistency / hygiene (mostly `dart fix --apply`-able) ---
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - sized_box_for_whitespace
    - use_super_parameters
