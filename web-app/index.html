<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Simone Mattioli" />

  <!--
    Title, description, canonical, Open Graph and Twitter tags are NOT set here.
    They come from <RouteHead> in each page component (src/components/RouteHead.tsx),
    which writes them into the prerendered HTML at build time and updates them on
    client-side navigation. Declaring them here as well produced two canonical
    links and two descriptions on every page.
  -->

  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- PWA Configuration -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mattioli.OS" />
  <link rel="apple-touch-icon" href="pwa-icon-v5.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
